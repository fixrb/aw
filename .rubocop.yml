# The target Ruby version is read from `required_ruby_version` in the gemspec.
AllCops:
  NewCops: enable

plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rake
  - rubocop-thread_safety

# Most readable form.
Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

# The tests are a flat list of `raise unless …` checks, each one a sentence:
# an empty line after each would double their length for nothing.
Layout/EmptyLineAfterGuardClause:
  Exclude:
    - test/**/*

# Fork.run holds the whole parent side in one place, on purpose: the fork,
# the guard against interruptions, the read, the wait and the cleanup.
Metrics/MethodLength:
  AllowedMethods:
    - run

# Fork is the whole mechanism, child side and parent side, in one module:
# small methods, each guarding one thing, add up to more lines than the
# default allows.
Metrics/ModuleLength:
  Max: 130

# Every class, module and method of the library carries a comment; YARD
# (`--fail-on-warning` in .yardopts) checks that its tags match the code.
# RuboCop sees the methods that `private_class_method` hides as public.
# Enabled explicitly: the next major release of RuboCop is expected to
# disable `Style/Documentation` by default.
Style/Documentation:
  Enabled: true
  Include:
    - lib/**/*.rb

Style/DocumentationMethod:
  Enabled: true
  Include:
    - lib/**/*.rb

# The tests exercise what the gem isolates: globals, the current directory,
# threads that interrupt the main one.
Style/GlobalVars:
  Exclude:
    - test/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

ThreadSafety/DirChdir:
  Exclude:
    - test/**/*

ThreadSafety/NewThread:
  Exclude:
    - test/**/*
